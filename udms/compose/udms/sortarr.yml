services:
  # Sortarr - Radarr backlog browser, shortest missing films first
  # Source: https://github.com/kylescudder/sortarr
  # Behind Cloudflare Access (Kyle only) for now, then Better Auth (allowlisted
  # members). Better Auth becomes the only gate once Sortarr leaves Access.
  sortarr:
    image: ghcr.io/kylescudder/sortarr:main
    container_name: sortarr
    restart: unless-stopped
    # profiles: ["media", "arrs", "all"]
    networks:
      - default
    # No published port: reached only through the forge-udms tunnel (sortarr:3210).
    user: "501:20"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.5
    environment:
      TZ: $TZ
      NODE_ENV: production
      APP_ORIGIN: https://sortarr.thescudders.org
      BETTER_AUTH_URL: https://sortarr.thescudders.org
      BETTER_AUTH_SECRET: ${SORTARR_BETTER_AUTH_SECRET:-}
      BREVO_API_KEY: ${SORTARR_BREVO_API_KEY:-}
      AUTH_EMAIL_FROM: sortarr@kylescudder.co.uk
      AUTH_EMAIL_DAILY_LIMIT: "40"
      AUTH_ALLOWED_EMAILS: ${SORTARR_AUTH_ALLOWED_EMAILS:-}
      DATABASE_URL: ${SORTARR_DATABASE_URL:-}
      RADARR_URL: http://radarr:7878
      RADARR_API_KEY: ${RADARR_API_KEY:-}
    depends_on:
      radarr:
        condition: service_started
      sortarr-migrate:
        condition: service_completed_successfully

  # One-shot: applies migrations with the owner role, then exits.
  sortarr-migrate:
    image: ghcr.io/kylescudder/sortarr:main
    container_name: sortarr-migrate
    restart: "no"
    networks:
      - default
    command: ["bun", "server/migrate.ts"]
    user: "501:20"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: ${SORTARR_MIGRATE_DATABASE_URL:-}
    depends_on:
      sortarr-db:
        condition: service_healthy

  # Postgres - Sortarr accounts, sessions and profile photos
  sortarr-db:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    container_name: sortarr-db
    restart: unless-stopped
    networks:
      - default
    security_opt:
      - no-new-privileges:true
    shm_size: 128m
    mem_limit: 256m
    volumes:
      - $DOCKERDIR/appdata/sortarr/postgres:/var/lib/postgresql
      - ./sortarr/initdb.sh:/docker-entrypoint-initdb.d/10-sortarr-roles.sh:ro
    environment:
      TZ: $TZ
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SORTARR_DB_PASSWORD:-}
      SORTARR_OWNER_PASSWORD: ${SORTARR_DB_OWNER_PASSWORD:-}
      SORTARR_RUNTIME_PASSWORD: ${SORTARR_DB_RUNTIME_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sortarr"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
